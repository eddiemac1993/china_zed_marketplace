{% for field in form %}
<div class="lm-field {% if field.name in full_fields %}full{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} *{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<div class="lm-help">{{ field.help_text }}</div>{% endif %}
  {{ field.errors }}
</div>
{% endfor %}
{% if form.non_field_errors %}<div class="lm-field full">{{ form.non_field_errors }}</div>{% endif %}
