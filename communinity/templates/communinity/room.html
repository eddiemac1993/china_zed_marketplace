{% extends "core/base.html" %}{% load static %}
{% block title %}Room {{ room.code }} · Communinity{% endblock %}
{% block content %}<link rel="stylesheet" href="{% static 'communinity/chat.css' %}?v=8"><main class="comm-shell"><section class="chat-card" data-code="{{ room.code }}"><header class="chat-head"><div><a href="{% url 'communinity:home' %}" class="leave">← Leave</a><h1>Room {{ room.code }}</h1><span id="online">1 online</span></div><button id="share" class="comm-btn">🔗 Copy link</button></header><div class="identity">You are <strong id="my-name">{{ anonymous_name }}</strong> <button id="change-name">🎲 Change Name</button></div><div class="messages-wrap"><div id="messages" class="messages" aria-live="polite"></div><button type="button" id="jumpBtn" class="jump-btn" hidden>↓ New messages</button></div><div id="typing" class="typing"></div><div id="chat-error" class="chat-error" role="alert"></div><form id="chat-form" class="composer">{% csrf_token %}<div class="composer-row"><input id="message-input" name="message" maxlength="500" placeholder="Type a message… 😊" autocomplete="off" required><button class="comm-btn comm-primary">Send</button></div><div class="composer-meta"><span id="charCount">0/500</span></div></form><small class="ai-note">Some rooms may include automated or AI participants.</small></section></main><script src="{% static 'communinity/chat.js' %}?v=8"></script>{% endblock %}
