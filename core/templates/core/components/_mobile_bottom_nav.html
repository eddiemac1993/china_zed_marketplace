<nav class="safe-b fixed inset-x-0 bottom-0 z-[400] border-t border-brand-border bg-white/95 shadow-[0_-4px_18px_rgba(0,0,0,.08)] backdrop-blur-lg lg:hidden print:hidden">
    <div class="grid grid-cols-5">
        <a href="{% url 'home' %}" class="flex flex-col items-center gap-0.5 py-2 text-[10px] font-semibold {% if not product_type and not query %}text-brand-orange{% else %}text-brand-muted{% endif %}">
            <span class="grid h-7 w-7 place-items-center"><i class="fa-solid fa-house text-base leading-none"></i></span>Home
        </a>
        <a href="{% url 'home' %}?type=local#results" class="flex flex-col items-center gap-0.5 py-2 text-[10px] font-semibold {% if product_type == 'local' %}text-brand-orange{% else %}text-brand-muted{% endif %}">
            <span class="grid h-7 w-7 place-items-center"><i class="fa-solid fa-box-open text-base leading-none"></i></span>Zambia
        </a>
        <a href="{% url 'home' %}?type=preorder#results" class="flex flex-col items-center gap-0.5 py-2 text-[10px] font-semibold {% if product_type == 'preorder' %}text-brand-orange{% else %}text-brand-muted{% endif %}">
            <span class="grid h-7 w-7 place-items-center"><i class="fa-solid fa-plane-departure text-base leading-none"></i></span>China
        </a>
        {% if request.user.is_authenticated %}
        <button type="button" @click="cartOpen = true; $dispatch('cartDrawerOpen')" class="relative flex flex-col items-center gap-0.5 py-2 text-[10px] font-semibold text-brand-muted">
            <span class="relative"><i class="fa-solid fa-cart-shopping text-lg leading-none"></i>{% if nav_cart_count %}<span class="absolute -right-2 -top-1.5 grid h-4 min-w-4 place-items-center rounded-full bg-brand-red px-0.5 text-[9px] font-bold text-white">{{ nav_cart_count }}</span>{% endif %}</span>Cart
        </button>
        <a href="{% url 'profile' %}" class="flex flex-col items-center gap-0.5 py-2 text-[10px] font-semibold text-brand-muted">
            <span class="grid h-7 w-7 place-items-center rounded-full"><i class="fa-solid fa-circle-user text-lg leading-none"></i></span>Account
        </a>
        {% else %}
        <a href="{% url 'login' %}" class="flex flex-col items-center gap-0.5 py-2 text-[10px] font-semibold text-brand-muted">
            <span class="grid h-7 w-7 place-items-center rounded-full"><i class="fa-solid fa-right-to-bracket text-base leading-none"></i></span>Login
        </a>
        <a href="{% url 'register' %}" class="flex flex-col items-center gap-0.5 py-2 text-[10px] font-semibold text-brand-red">
            <span class="grid h-7 w-7 place-items-center rounded-full"><i class="fa-solid fa-user-plus text-base leading-none"></i></span>Join
        </a>
        {% endif %}
    </div>
</nav>
