<div class="reveal relative mb-2.5 flex items-center justify-between gap-1.5 overflow-hidden rounded-lg border border-orange-200 bg-gradient-to-r from-orange-50 via-white to-red-50 px-2.5 py-2 shadow-sm sm:mb-3.5 sm:gap-4 sm:rounded-xl sm:border-0 sm:bg-gradient-to-br sm:from-brand-orange sm:to-brand-red sm:p-5 sm:shadow-lg sm:shadow-orange-900/20"
     x-data="{
        hours: '00', mins: '00', secs: '00',
        init() {
            const key = 'czFlashEnd';
            const durationMs = 24 * 60 * 60 * 1000;
            let end = parseInt(localStorage.getItem(key), 10);
            if (!end || end <= Date.now()) {
                end = Date.now() + durationMs;
                localStorage.setItem(key, String(end));
            }
            const tick = () => {
                let diff = Math.max(0, end - Date.now());
                if (diff <= 0) {
                    end = Date.now() + durationMs;
                    localStorage.setItem(key, String(end));
                    diff = durationMs;
                }
                this.hours = String(Math.floor(diff / 3600000)).padStart(2, '0');
                this.mins = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
                this.secs = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
            };
            tick();
            setInterval(tick, 1000);
        }
     }">
    <span class="pointer-events-none absolute -left-5 -top-8 h-20 w-20 rounded-full bg-brand-orange/10 sm:hidden"></span>
    <div class="relative flex min-w-0 items-center gap-2 sm:gap-3.5">
        <span class="grid h-7 w-7 shrink-0 place-items-center rounded-full bg-brand-orange text-xs text-white shadow-sm shadow-orange-300 sm:h-auto sm:w-auto sm:bg-transparent sm:text-4xl sm:shadow-none"><i class="fa-solid fa-bolt animate-pulse leading-none"></i></span>
        <div class="min-w-0">
            <div class="flex items-center gap-1.5">
                <h3 class="whitespace-nowrap font-display text-[13px] font-black uppercase tracking-wide text-brand-ink sm:text-2xl sm:text-white">Flash Deals</h3>
                <span class="rounded-full bg-brand-red px-1.5 py-0.5 text-[8px] font-black uppercase tracking-wide text-white sm:hidden">Live</span>
            </div>
            <p class="text-[8px] font-bold uppercase tracking-wide text-brand-muted sm:text-sm sm:normal-case sm:text-white/90">Ends in</p>
        </div>
    </div>
    <div class="relative flex items-center gap-1">
        <div class="min-w-[38px] rounded-md bg-brand-red px-2 py-1.5 text-center shadow-sm sm:min-w-[60px] sm:rounded-lg sm:bg-white/95 sm:px-3 sm:py-2">
            <span class="block font-display text-[13px] font-black leading-none text-white sm:text-3xl sm:text-brand-red-dark" x-text="hours"></span>
            <span class="hidden text-[9px] font-bold uppercase tracking-wide text-brand-muted sm:block">Hours</span>
        </div>
        <span class="font-black text-brand-red sm:hidden">:</span>
        <div class="min-w-[38px] rounded-md bg-brand-red px-2 py-1.5 text-center shadow-sm sm:min-w-[60px] sm:rounded-lg sm:bg-white/95 sm:px-3 sm:py-2">
            <span class="block font-display text-[13px] font-black leading-none text-white sm:text-3xl sm:text-brand-red-dark" x-text="mins"></span>
            <span class="hidden text-[9px] font-bold uppercase tracking-wide text-brand-muted sm:block">Mins</span>
        </div>
        <span class="font-black text-brand-red sm:hidden">:</span>
        <div class="min-w-[38px] rounded-md bg-brand-red px-2 py-1.5 text-center shadow-sm sm:min-w-[60px] sm:rounded-lg sm:bg-white/95 sm:px-3 sm:py-2">
            <span class="block font-display text-[13px] font-black leading-none text-white sm:text-3xl sm:text-brand-red-dark" x-text="secs"></span>
            <span class="hidden text-[9px] font-bold uppercase tracking-wide text-brand-muted sm:block">Secs</span>
        </div>
    </div>
</div>
