<div class="reveal mb-3.5 flex flex-col items-start gap-4 rounded-xl bg-gradient-to-br from-brand-orange to-brand-red p-5 shadow-lg shadow-orange-900/20 sm:flex-row sm:items-center sm:justify-between"
     x-data="{
        hours: '00', mins: '00', secs: '00',
        init() {
            const key = 'czFlashEnd';
            const durationMs = 24 * 60 * 60 * 1000;
            let end = parseInt(localStorage.getItem(key), 10);
            if (!end || end <= Date.now()) {
                end = Date.now() + durationMs;
                localStorage.setItem(key, String(end));
            }
            const tick = () => {
                let diff = Math.max(0, end - Date.now());
                if (diff <= 0) {
                    end = Date.now() + durationMs;
                    localStorage.setItem(key, String(end));
                    diff = durationMs;
                }
                this.hours = String(Math.floor(diff / 3600000)).padStart(2, '0');
                this.mins = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
                this.secs = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
            };
            tick();
            setInterval(tick, 1000);
        }
     }">
    <div class="flex items-center gap-3.5">
        <i class="fa-solid fa-bolt animate-pulse text-4xl leading-none text-white sm:text-4xl"></i>
        <div>
            <h3 class="font-display text-xl font-black uppercase tracking-wide text-white sm:text-2xl">Flash Sale Ends Soon</h3>
            <p class="text-xs font-semibold text-white/90 sm:text-sm">Grab deals before time runs out!</p>
        </div>
    </div>
    <div class="flex gap-2.5">
        <div class="min-w-[54px] rounded-lg bg-white/95 px-3 py-2 text-center sm:min-w-[60px]">
            <span class="block font-display text-2xl font-black leading-none text-brand-red-dark sm:text-3xl" x-text="hours"></span>
            <span class="block text-[9px] font-bold uppercase tracking-wide text-brand-muted">Hours</span>
        </div>
        <div class="min-w-[54px] rounded-lg bg-white/95 px-3 py-2 text-center sm:min-w-[60px]">
            <span class="block font-display text-2xl font-black leading-none text-brand-red-dark sm:text-3xl" x-text="mins"></span>
            <span class="block text-[9px] font-bold uppercase tracking-wide text-brand-muted">Mins</span>
        </div>
        <div class="min-w-[54px] rounded-lg bg-white/95 px-3 py-2 text-center sm:min-w-[60px]">
            <span class="block font-display text-2xl font-black leading-none text-brand-red-dark sm:text-3xl" x-text="secs"></span>
            <span class="block text-[9px] font-bold uppercase tracking-wide text-brand-muted">Secs</span>
        </div>
    </div>
</div>
