{% extends "core/base.html" %}

{% block title %}Password Reset Successful · ChinaZed{% endblock %}

{% block content %}
<div class="mx-auto flex min-h-[calc(100vh-260px)] max-w-[500px] items-center px-4 py-8">
    <div class="w-full overflow-hidden rounded-xl border border-brand-border bg-white text-center shadow-lg">

        <div class="bg-brand-red px-6 py-8">
            <div class="font-display text-[40px] font-black tracking-tight text-white">CHINAZED</div>
            <div class="mt-1.5 text-[13px] text-white/85">China to Zambia Marketplace</div>
        </div>

        <div class="p-9">
            <i class="fa-solid fa-circle-check mb-4 block text-5xl text-brand-green"></i>
            <h2 class="mb-3.5 text-3xl font-bold text-brand-ink">Password Reset Successful</h2>
            <p class="mb-6 text-[15px] leading-relaxed text-brand-muted">Your password has been changed successfully. You can now log in with your new password.</p>
            <a href="{% url 'login' %}" class="inline-block rounded-lg bg-brand-red px-7 py-3.5 text-[15px] font-bold text-white transition hover:bg-brand-red-dark">LOGIN NOW</a>
        </div>

    </div>
</div>
{% endblock %}
