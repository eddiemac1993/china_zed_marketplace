{% load static %}
{% load ad_tags %}
{% get_current_ads as ads %}

{% if ads %}
<div class="reveal mb-3.5 overflow-hidden rounded-xl border border-brand-border" x-data x-init="new Swiper($el.querySelector('.swiper'), { loop: {{ ads|length }} > 1, autoplay: { delay: 4500, disableOnInteraction: false }, pagination: { el: $el.querySelector('.swiper-pagination'), clickable: true } })">
    <div class="swiper">
        <div class="swiper-wrapper">
            {% for ad in ads %}
            <a href="{{ ad.cta_url }}" target="_blank" rel="noopener" class="swiper-slide flex items-center gap-4 bg-white p-4 sm:p-5">
                <div class="h-16 w-16 shrink-0 overflow-hidden rounded-lg bg-neutral-100 sm:h-20 sm:w-20">
                    {% if ad.image %}
                        <img src="{{ ad.image.url }}" alt="{{ ad.advertiser_name }}" class="h-full w-full object-cover">
                    {% else %}
                        <div class="grid h-full w-full place-items-center text-2xl text-neutral-400"><i class="fa-solid fa-bullhorn"></i></div>
                    {% endif %}
                </div>
                <div class="min-w-0 flex-1">
                    <div class="text-[10px] font-bold uppercase tracking-wide text-brand-muted">Sponsored</div>
                    <div class="truncate text-sm font-bold text-brand-ink">{{ ad.headline }}</div>
                    {% if ad.subtext %}<div class="truncate text-xs text-brand-muted">{{ ad.subtext }}</div>{% endif %}
                </div>
                <span class="shrink-0 whitespace-nowrap rounded-md bg-brand-red px-3.5 py-2 text-xs font-bold text-white">{{ ad.cta_text }}</span>
            </a>
            {% endfor %}
        </div>
        <div class="swiper-pagination relative! mt-1! pb-2!"></div>
    </div>
</div>
{% endif %}
