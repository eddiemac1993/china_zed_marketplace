{% extends "core/base.html" %}

{% block title %}Your advert is live | ChinaZed{% endblock %}

{% block content %}
<div class="mx-auto max-w-lg px-3 py-8 sm:px-5 sm:py-12">
    <div class="rounded-2xl border border-brand-border bg-white p-5 text-center shadow-sm sm:p-8">
        <div class="mx-auto grid h-16 w-16 place-items-center rounded-full bg-green-100 text-3xl text-green-600"><i class="fa-solid fa-check"></i></div>
        <h1 class="mt-4 font-display text-3xl font-black text-brand-ink">Your advert is live!</h1>
        <p class="mt-2 text-sm leading-relaxed text-brand-muted">It will appear randomly among product cards on the ChinaZed home page.</p>

        <div class="relative mx-auto mt-6 aspect-square max-w-72 overflow-hidden rounded-xl border border-amber-300 bg-amber-50 shadow-sm">
            <img src="{{ advertisement.image.url }}" alt="Your live advert" class="h-full w-full object-cover">
            <span class="absolute left-2 top-2 rounded-full bg-amber-400 px-2 py-0.5 text-[10px] font-black uppercase tracking-wide text-amber-950 shadow">Sponsored</span>
        </div>

        <div class="mt-6 grid gap-2 sm:grid-cols-2">
            <a href="{% url 'home' %}" class="rounded-lg bg-brand-red px-4 py-3 text-sm font-black text-white transition hover:bg-brand-red-dark"><i class="fa-solid fa-house mr-1.5"></i> View home page</a>
            <a href="{% url 'advertise' %}" class="rounded-lg border border-brand-border px-4 py-3 text-sm font-bold text-brand-ink transition hover:border-brand-orange hover:text-brand-orange"><i class="fa-solid fa-plus mr-1.5"></i> Post another</a>
        </div>
    </div>
</div>
{% endblock %}
